<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEM Shortcuts</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1>AEM Shortcuts</h1>
    <nav class="shortcuts-list">
      <button class="shortcut-btn" data-shortcut="edit">Edit</button>
      <button class="shortcut-btn" data-shortcut="preview">Preview</button>
      <button class="shortcut-btn" data-shortcut="sites">Sites</button>
      <button class="shortcut-btn" data-shortcut="propezrties">Properties</button>
      <button class="shortcut-btn" data-shortcut="crxde">CRXDE</button>
    </nav>
    <div class="status" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
